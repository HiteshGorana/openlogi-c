name: macOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      CC: clang
      UBSAN_OPTIONS: halt_on_error=1

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build tools and test suites
        run: make -j3 all

      - name: Test installer and updater
        run: sh tests/test_install.sh

      - name: Test release publishing
        run: sh tests/test_release.sh

      - name: Run tests
        run: make test VERBOSE=1

      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        run: make asan VERBOSE=1
